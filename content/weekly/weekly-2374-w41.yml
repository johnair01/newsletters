# SYNTHETIC SAMPLE DATA — fabricated, Star-Trek-flavored content only (no real org/tool/
# metric/site/program/colleague names). This is the COMMITTED worked example for WKLY-05: the
# weekly for the fabricated module that lives in content/module/, authored against the full
# eight-key schema (docs/weekly-spec.md).
#
# THREE ABSENCES ARE PLANTED HERE ON PURPOSE. They are the point of the sample, not defects —
# a weekly that hides what it does not know teaches the wrong lesson to whoever copies it:
#   1. a lane with NO KPIs — comes from the bound content/module config (the MOR/IQ lane),
#      not from this file, and lands in missing[] as the composer's "declares no KPIs" row;
#   2. `recognitions[1]` carries NO `source:` — credit is still given, the absence of the
#      evidence is disclosed, and nothing is fabricated to fill the hole;
#   3. the `manifest-annex-photo` asset OMITS `folder:` — provenance is checked BEFORE the
#      file is read, so the image is never placed and needs no file on disk at all.
# The FIRST recognition resolves (its `source:` is the .eml below, whose Source.id IS that
# repo-relative path), so the absence row above has something honest to contrast against.
